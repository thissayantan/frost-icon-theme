# The colour builder page: build dist/site from the sources and publish it to GitHub Pages on every push to main.
name: colour builder page
on:
  push:
    branches: [main]
    paths: [site/**, tools/**, src/**, presets/**, schema/**, docs/DESIGN.md, package.json, bun.lock]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun tools/site.ts
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist/site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

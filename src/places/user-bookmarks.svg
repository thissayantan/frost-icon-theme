<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="128" height="128" viewBox="0 0 128 128">
  <!-- Hyaline user-bookmarks — generic glass layout, palette token yellow, glyph: bookmark ribbon. Glyph ≤32 centred at (58, 74). -->
  <defs>
    <!-- palette token: yellow (light → deep) -->
    <linearGradient id="tint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE17D"/>
      <stop offset="1" stop-color="#FFAA1F"/>
    </linearGradient>
    <linearGradient id="plate-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="rim-stroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".70"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".12"/>
    </linearGradient>
    <rect id="back-shape" x="36" y="12" width="84" height="84" rx="20" fill="url(#tint)"/>
    <rect id="plate-shape" x="16" y="40" width="80" height="72" rx="18"/>
    <!-- glyph hints for the ≤24 px squircle re-layout (units = pixels at that size) -->
    <g id="glyph-16" transform="scale(8.0000)"><path d="M5 3 H11 V13 L8 10.5 L5 13 Z" fill="#FFFFFF"/></g>
    <g id="glyph-22" transform="scale(5.8182)"><path d="M7.5 5 H14.5 V17 L11 14 L7.5 17 Z" fill="#FFFFFF"/></g>
    <g id="glyph-24" transform="scale(5.3333)"><path d="M8 5 H16 V19 L12 15.5 L8 19 Z" fill="#FFFFFF"/></g>
    <clipPath id="plate-clip"><use xlink:href="#plate-shape"/></clipPath>
    <filter id="blur-shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="blur-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur-frost" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur-lift" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <mask id="outside-plate"><rect width="128" height="128" fill="#FFFFFF"/><use xlink:href="#plate-shape" fill="#000000"/></mask>
  </defs>

  <ellipse id="shadow" cx="64" cy="115" rx="40" ry="4" fill="#000000" opacity=".12" filter="url(#blur-shadow)"/>
  <use id="glow" xlink:href="#back-shape" transform="translate(0 4)" opacity=".35" filter="url(#blur-glow)"/>
  <use id="back" xlink:href="#back-shape"/>
  <g id="frost" clip-path="url(#plate-clip)"><use xlink:href="#back-shape" filter="url(#blur-frost)"/></g>
  <!-- lift: plate-only contact shadow, masked to outside the plate so the glass itself never greys -->
  <g id="lift" mask="url(#outside-plate)">
    <use xlink:href="#plate-shape" transform="translate(0 2)" fill="#000000" opacity=".08" filter="url(#blur-lift)"/>
  </g>
  <use id="plate" xlink:href="#plate-shape" fill="url(#plate-fill)"/>
  <g id="rim" clip-path="url(#plate-clip)">
    <use xlink:href="#plate-shape" fill="none" stroke="url(#rim-stroke)" stroke-width="3"/>
  </g>
  <g id="glyph" transform="translate(58 74) scale(0.84) translate(-52 -80)">
    <path d="M41 61 H63 a3 3 0 0 1 3 3 V99 L52 90 L38 99 V64 a3 3 0 0 1 3 -3 Z" fill="#FFFFFF"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="128" height="128" viewBox="0 0 128 128">
  <!-- Hyaline user-home — folder family with the house glyph.
       Glyph box 44–84 × 66–103, centred on the flap. -->
  <defs>
    <linearGradient id="tint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8CB8FF"/>
      <stop offset="1" stop-color="#3F6DF5"/>
    </linearGradient>
    <linearGradient id="plate-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="rim-stroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".70"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".12"/>
    </linearGradient>
    <path id="back-shape" fill="url(#tint)"
          d="M12 32 a12 12 0 0 1 12 -12 h24 a8 8 0 0 1 6 2.6 l7 7.4 h43 a12 12 0 0 1 12 12 v58 a12 12 0 0 1 -12 12 h-80 a12 12 0 0 1 -12 -12 z"/>
    <path id="plate-shape" d="M12 66 a10 10 0 0 1 10 -10 h84 a10 10 0 0 1 10 10 v34 a12 12 0 0 1 -12 12 h-80 a12 12 0 0 1 -12 -12 z"/>
    <!-- pixel-grid hints: derive() swaps these in at 16/22/24/32/48 px (DESIGN §4) -->
    <path id="back-shape-16" d="M8 28 a12 12 0 0 1 12 -12 H52 L64 32 H108 a12 12 0 0 1 12 12 V100 a12 12 0 0 1 -12 12 H20 a12 12 0 0 1 -12 -12 Z"/>
    <path id="back-shape-22" d="M11.636 29.091 a11.636 11.636 0 0 1 11.636 -11.636 H46.545 L58.182 29.091 H104.727 a11.636 11.636 0 0 1 11.636 11.636 V98.909 a11.636 11.636 0 0 1 -11.636 11.636 H23.273 a11.636 11.636 0 0 1 -11.636 -11.636 Z"/>
    <path id="plate-shape-22" d="M11.636 66.909 a8.727 8.727 0 0 1 8.727 -8.727 H107.636 a8.727 8.727 0 0 1 8.727 8.727 V98.909 a11.636 11.636 0 0 1 -11.636 11.636 H23.273 a11.636 11.636 0 0 1 -11.636 -11.636 Z"/>
    <path id="back-shape-24" d="M10.667 26.667 a10.667 10.667 0 0 1 10.667 -10.667 H48 L58.667 26.667 H106.667 a10.667 10.667 0 0 1 10.667 10.667 V101.333 a10.667 10.667 0 0 1 -10.667 10.667 H21.333 a10.667 10.667 0 0 1 -10.667 -10.667 Z"/>
    <path id="plate-shape-24" d="M10.667 66.667 a8 8 0 0 1 8 -8 H109.333 a8 8 0 0 1 8 8 V101.333 a10.667 10.667 0 0 1 -10.667 10.667 H21.333 a10.667 10.667 0 0 1 -10.667 -10.667 Z"/>
    <path id="back-shape-32" d="M12 32 a12 12 0 0 1 12 -12 H48 L60 32 H104 a12 12 0 0 1 12 12 V100 a12 12 0 0 1 -12 12 H24 a12 12 0 0 1 -12 -12 Z"/>
    <path id="plate-shape-32" d="M12 66 a10 10 0 0 1 10 -10 H106 a10 10 0 0 1 10 10 V100 a12 12 0 0 1 -12 12 H24 a12 12 0 0 1 -12 -12 Z"/>
    <path id="back-shape-48" d="M10.667 29.333 a10.667 10.667 0 0 1 10.667 -10.667 H45.333 L56 29.333 H105.333 a12 12 0 0 1 12 12 V100 a12 12 0 0 1 -12 12 H22.667 a12 12 0 0 1 -12 -12 Z"/>
    <path id="plate-shape-48" d="M10.667 65.333 a9.333 9.333 0 0 1 9.333 -9.333 H108 a9.333 9.333 0 0 1 9.333 9.333 V100 a12 12 0 0 1 -12 12 H22.667 a12 12 0 0 1 -12 -12 Z"/>
    <clipPath id="plate-clip"><use xlink:href="#plate-shape"/></clipPath>
    <filter id="blur-shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="blur-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur-frost" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <ellipse id="shadow" cx="64" cy="114" rx="44" ry="4" fill="#000000" opacity=".12" filter="url(#blur-shadow)"/>
  <use id="glow" xlink:href="#back-shape" transform="translate(0 4)" opacity=".35" filter="url(#blur-glow)"/>
  <use id="back" xlink:href="#back-shape"/>
  <g id="frost" clip-path="url(#plate-clip)"><use xlink:href="#back-shape" filter="url(#blur-frost)"/></g>
  <use id="plate" xlink:href="#plate-shape" fill="url(#plate-fill)"/>
  <g id="rim" clip-path="url(#plate-clip)">
    <use xlink:href="#plate-shape" fill="none" stroke="url(#rim-stroke)" stroke-width="3"/>
  </g>
  <!-- user-home glyph: owner reference docs/references/user-home-glyph.png — trapezoid roof, box body, door tucked under the roof line -->
  <g id="glyph">
    <path d="M52 66 H76 a3 3 0 0 1 2.9 2.2 L83 79 a2.4 2.4 0 0 1 -2.3 3 H47.3 a2.4 2.4 0 0 1 -2.3 -3 L49.1 68.2 A3 3 0 0 1 52 66 Z" fill="#FFFFFF"/>
    <path d="M49 82 H79 V99 a4 4 0 0 1 -4 4 H53 a4 4 0 0 1 -4 -4 Z" fill="#FFFFFF" fill-opacity=".78"/>
    <rect x="59.5" y="82" width="9" height="12" rx="1.5" fill="#3F6DF5" fill-opacity=".55"/>
  </g>
</svg>
